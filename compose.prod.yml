x-houkago-server-image: &houkago-server-image
  image: ${HOUKAGO_SERVER_IMAGE:?Set HOUKAGO_SERVER_IMAGE in backend-release.env}

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in server.env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in server.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in server.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in server.env}
      TZ: Asia/Seoul
    expose:
      - "3306"
    volumes:
      - type: bind
        source: /opt/houkago/mysql
        target: /var/lib/mysql
    networks:
      - houkago-internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  app:
    <<: *houkago-server-image
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      HOUKAGO_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?Set MYSQL_DATABASE in server.env}
      HOUKAGO_DB_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in server.env}
      HOUKAGO_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in server.env}
      HOUKAGO_RESYNC_ENABLED: ${HOUKAGO_RESYNC_ENABLED:-false}
      HOUKAGO_RESYNC_POSTS_ROOT: ${HOUKAGO_RESYNC_POSTS_ROOT:-/workspace/houkago.posts}
      HOUKAGO_RESYNC_COMMIT_HASH: ${HOUKAGO_RESYNC_COMMIT_HASH:-}
      HOUKAGO_PUBLIC_ASSET_ORIGIN: ${HOUKAGO_PUBLIC_ASSET_ORIGIN:?Set HOUKAGO_PUBLIC_ASSET_ORIGIN in server.env}
      HOUKAGO_POSTS_WEBHOOK_ENABLED: ${HOUKAGO_POSTS_WEBHOOK_ENABLED:-false}
      HOUKAGO_POSTS_WEBHOOK_SECRET: ${HOUKAGO_POSTS_WEBHOOK_SECRET:-}
      HOUKAGO_POSTS_WEBHOOK_REPOSITORY_FULL_NAME: ${HOUKAGO_POSTS_WEBHOOK_REPOSITORY_FULL_NAME:-}
      HOUKAGO_POSTS_WEBHOOK_REF: ${HOUKAGO_POSTS_WEBHOOK_REF:-refs/heads/main}
      HOUKAGO_POSTS_WEBHOOK_SPOOL_ROOT: ${HOUKAGO_POSTS_WEBHOOK_SPOOL_ROOT:-/workspace/sync-jobs}
      HOUKAGO_DEPLOY_WEBHOOK_ENABLED: ${HOUKAGO_DEPLOY_WEBHOOK_ENABLED:-false}
      HOUKAGO_DEPLOY_WEBHOOK_SECRET: ${HOUKAGO_DEPLOY_WEBHOOK_SECRET:-}
      HOUKAGO_DEPLOY_IMAGE_REPOSITORY: ${HOUKAGO_DEPLOY_IMAGE_REPOSITORY:-ghcr.io/hokago-memories/houkago.server}
      HOUKAGO_DEPLOY_SPOOL_ROOT: ${HOUKAGO_DEPLOY_SPOOL_ROOT:-/workspace/deploy-jobs}
      HOUKAGO_DEPLOY_WORKER_GRACE_PERIOD: ${HOUKAGO_DEPLOY_WORKER_GRACE_PERIOD:-5s}
      HOUKAGO_OPS_WEBHOOK_ENABLED: ${HOUKAGO_OPS_WEBHOOK_ENABLED:-false}
      HOUKAGO_OPS_WEBHOOK_SECRET: ${HOUKAGO_OPS_WEBHOOK_SECRET:-}
      HOUKAGO_OPS_SPOOL_ROOT: ${HOUKAGO_OPS_SPOOL_ROOT:-/workspace/deploy-jobs/ops}
      HOUKAGO_OPS_WORKER_GRACE_PERIOD: ${HOUKAGO_OPS_WORKER_GRACE_PERIOD:-5s}
      SERVER_PORT: 8080
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: /opt/houkago/posts
        target: ${HOUKAGO_RESYNC_POSTS_ROOT:-/workspace/houkago.posts}
        read_only: true
      - type: bind
        source: /opt/houkago/sync-jobs
        target: ${HOUKAGO_POSTS_WEBHOOK_SPOOL_ROOT:-/workspace/sync-jobs}
      - type: bind
        source: /opt/houkago/sync-jobs/processing
        target: ${HOUKAGO_POSTS_WEBHOOK_SPOOL_ROOT:-/workspace/sync-jobs}/processing
        read_only: true
      - type: bind
        source: /opt/houkago/sync-jobs/succeeded
        target: ${HOUKAGO_POSTS_WEBHOOK_SPOOL_ROOT:-/workspace/sync-jobs}/succeeded
        read_only: true
      - type: bind
        source: /opt/houkago/sync-jobs/failed
        target: ${HOUKAGO_POSTS_WEBHOOK_SPOOL_ROOT:-/workspace/sync-jobs}/failed
        read_only: true
      - type: bind
        source: /opt/houkago/deploy-jobs
        target: ${HOUKAGO_DEPLOY_SPOOL_ROOT:-/workspace/deploy-jobs}
      - type: bind
        source: /opt/houkago/deploy-jobs/processing
        target: ${HOUKAGO_DEPLOY_SPOOL_ROOT:-/workspace/deploy-jobs}/processing
        read_only: true
      - type: bind
        source: /opt/houkago/deploy-jobs/succeeded
        target: ${HOUKAGO_DEPLOY_SPOOL_ROOT:-/workspace/deploy-jobs}/succeeded
        read_only: true
      - type: bind
        source: /opt/houkago/deploy-jobs/failed
        target: ${HOUKAGO_DEPLOY_SPOOL_ROOT:-/workspace/deploy-jobs}/failed
        read_only: true
      - type: bind
        source: /opt/houkago/deploy-jobs/ops/processing
        target: ${HOUKAGO_OPS_SPOOL_ROOT:-/workspace/deploy-jobs/ops}/processing
        read_only: true
      - type: bind
        source: /opt/houkago/deploy-jobs/ops/succeeded
        target: ${HOUKAGO_OPS_SPOOL_ROOT:-/workspace/deploy-jobs/ops}/succeeded
        read_only: true
      - type: bind
        source: /opt/houkago/deploy-jobs/ops/failed
        target: ${HOUKAGO_OPS_SPOOL_ROOT:-/workspace/deploy-jobs/ops}/failed
        read_only: true
    group_add:
      - ${HOUKAGO_DEPLOY_GID:-2002}
    networks:
      - houkago-internal
    restart: unless-stopped
    stop_grace_period: 30s

  sync:
    <<: *houkago-server-image
    profiles:
      - sync
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker,sync
      HOUKAGO_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?Set MYSQL_DATABASE in server.env}
      HOUKAGO_DB_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in server.env}
      HOUKAGO_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in server.env}
      HOUKAGO_RESYNC_ENABLED: "true"
      HOUKAGO_RESYNC_POSTS_ROOT: ${HOUKAGO_RESYNC_POSTS_ROOT:-/workspace/houkago.posts}
      HOUKAGO_RESYNC_COMMIT_HASH: ${HOUKAGO_RESYNC_COMMIT_HASH:-}
      TZ: Asia/Seoul
    volumes:
      - type: bind
        source: /opt/houkago/posts
        target: ${HOUKAGO_RESYNC_POSTS_ROOT:-/workspace/houkago.posts}
        read_only: true
    networks:
      - houkago-internal

  asset-sync:
    <<: *houkago-server-image
    profiles:
      - asset-sync
    environment:
      SPRING_PROFILES_ACTIVE: docker,asset-sync
      HOUKAGO_ASSET_PUBLICATION_POSTS_ROOT: ${HOUKAGO_ASSET_PUBLICATION_POSTS_ROOT:-/workspace/houkago.posts}
      HOUKAGO_ASSET_PUBLICATION_ASSET_ROOT: ${HOUKAGO_PUBLIC_ASSET_ROOT:-/workspace/public-assets}
      HOUKAGO_ASSET_PUBLICATION_GENERATION_ID: ${HOUKAGO_ASSET_PUBLICATION_GENERATION_ID:-}
      HOUKAGO_ASSET_PUBLICATION_ACTION: ${HOUKAGO_ASSET_PUBLICATION_ACTION:-publish}
      TZ: Asia/Seoul
    volumes:
      - type: bind
        source: /opt/houkago/posts
        target: ${HOUKAGO_ASSET_PUBLICATION_POSTS_ROOT:-/workspace/houkago.posts}
        read_only: true
      - type: bind
        source: /opt/houkago/assets
        target: ${HOUKAGO_PUBLIC_ASSET_ROOT:-/workspace/public-assets}
    network_mode: none

networks:
  houkago-internal:
    driver: bridge

name: Backend Image Publish

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ARM64 Image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      IMAGE_NAME: ghcr.io/hokago-memories/houkago.server
      IMAGE_SOURCE: https://github.com/HOKAGO-MEMORIES/houkago.server
      IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      TARGET_PLATFORM: linux/arm64

    steps:
      - name: Check out verified revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify target revision
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          test "$checkout_sha" = "$TARGET_SHA"
          printf 'Target revision: %s\n' "$TARGET_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable tag
        id: existing
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}:${IMAGE_TAG}"

          set +e
          inspect_output="$(docker buildx imagetools inspect "$image_ref" 2>&1)"
          inspect_status=$?
          set -e

          if [ "$inspect_status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            printf 'Image tag already exists; the existing artifact will be verified.\n'
          elif printf '%s' "$inspect_output" | grep -Eqi \
            'manifest unknown|name unknown|not found'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            printf 'Image tag does not exist and will be published.\n'
          else
            printf 'Unable to determine whether the image tag exists.\n' >&2
            exit 1
          fi

      - name: Build and push ARM64 image
        if: steps.existing.outputs.exists == 'false'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.TARGET_PLATFORM }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.TARGET_SHA }}
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}
          cache-from: type=gha,scope=houkago-server-arm64
          cache-to: type=gha,mode=max,scope=houkago-server-arm64

      - name: Verify published image
        id: verify
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}:${IMAGE_TAG}"
          docker pull "$image_ref"

          digest_ref="$(docker image inspect \
            --format '{{index .RepoDigests 0}}' "$image_ref")"
          digest="${digest_ref#*@}"
          architecture="$(docker image inspect \
            --format '{{.Architecture}}' "$image_ref")"
          os="$(docker image inspect --format '{{.Os}}' "$image_ref")"
          revision="$(docker image inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
            "$image_ref")"
          source="$(docker image inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.source"}}' \
            "$image_ref")"

          test "$digest" != "$digest_ref"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$architecture" = "arm64"
          test "$os" = "linux"
          test "$revision" = "$TARGET_SHA"
          test "$source" = "$IMAGE_SOURCE"

          if [ "${{ steps.existing.outputs.exists }}" = "false" ]; then
            test "$digest" = "${{ steps.build.outputs.digest }}"
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Request Production deployment
        id: deploy
        env:
          DEPLOY_URL: https://api.houkago.moe/internal/deployments/backend
          DEPLOY_SECRET: ${{ secrets.HOUKAGO_BACKEND_DEPLOY_SECRET }}
          VERIFIED_IMAGE_REF: ${{ steps.verify.outputs.image_ref }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SECRET"

          delivery_id="$(cat /proc/sys/kernel/random/uuid)"
          payload_file="$RUNNER_TEMP/backend-deploy-payload.json"
          response_file="$RUNNER_TEMP/backend-deploy-response.txt"
          python3 - "$delivery_id" "$TARGET_SHA" "$VERIFIED_IMAGE_REF" \
            "$payload_file" <<'PY'
          import json
          import pathlib
          import sys

          delivery_id, revision, image, output_path = sys.argv[1:]
          pathlib.Path(output_path).write_text(
              json.dumps(
                  {
                      "deliveryId": delivery_id,
                      "revision": revision,
                      "image": image,
                  },
                  separators=(",", ":"),
              ),
              encoding="utf-8",
          )
          PY

          request_started_at="$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
          http_status=""
          for attempt in 1 2 3; do
            set +e
            http_status="$(curl \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --connect-timeout 5 \
              --max-time 20 \
              --request POST \
              --header "Authorization: Bearer $DEPLOY_SECRET" \
              --header 'Content-Type: application/json' \
              --data-binary "@$payload_file" \
              "$DEPLOY_URL")"
            curl_status=$?
            set -e

            if [ "$curl_status" -eq 0 ] && [ "$http_status" = "202" ]; then
              break
            fi
            if [ "$curl_status" -eq 0 ] \
              && [ "$http_status" != "429" ] \
              && ! printf '%s' "$http_status" | grep -Eq '^5[0-9]{2}$'; then
              printf 'Deployment request rejected with HTTP %s.\n' "$http_status" >&2
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              printf 'Deployment request failed after %s attempts (curl=%s, HTTP=%s).\n' \
                "$attempt" "$curl_status" "${http_status:-unavailable}" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
          response_completed_at="$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"

          {
            echo "delivery_id=$delivery_id"
            echo "http_status=$http_status"
            echo "request_started_at=$request_started_at"
            echo "response_completed_at=$response_completed_at"
          } >> "$GITHUB_OUTPUT"
          printf 'Production deployment request accepted for delivery %s.\n' "$delivery_id"

      - name: Write artifact summary
        env:
          VERIFIED_DIGEST: ${{ steps.verify.outputs.digest }}
          VERIFIED_IMAGE_REF: ${{ steps.verify.outputs.image_ref }}
          EXISTING_TAG: ${{ steps.existing.outputs.exists }}
          DEPLOY_DELIVERY_ID: ${{ steps.deploy.outputs.delivery_id }}
          DEPLOY_HTTP_STATUS: ${{ steps.deploy.outputs.http_status }}
          DEPLOY_RESPONSE_COMPLETED_AT: ${{ steps.deploy.outputs.response_completed_at }}
        run: |
          {
            printf "## Backend ARM64 image\n\n"
            printf -- "- Revision: \`%s\`\n" "$TARGET_SHA"
            printf -- "- Image: \`%s:%s\`\n" "$IMAGE_NAME" "$IMAGE_TAG"
            printf -- "- Digest: \`%s\`\n" "$VERIFIED_DIGEST"
            printf -- "- Deployment reference: \`%s\`\n" "$VERIFIED_IMAGE_REF"
            printf -- "- Platform: \`%s\`\n" "$TARGET_PLATFORM"
            printf -- "- Existing immutable tag: \`%s\`\n" "$EXISTING_TAG"
            printf "\n## Production deployment request\n\n"
            printf -- "- Delivery ID: \`%s\`\n" "$DEPLOY_DELIVERY_ID"
            printf -- "- HTTP result: \`%s Accepted\`\n" "$DEPLOY_HTTP_STATUS"
            printf -- "- Response completed at: \`%s\`\n" "$DEPLOY_RESPONSE_COMPLETED_AT"
            printf -- "- Scope: queue acceptance only; OCI Deploy Worker is the Production truth source.\n"
          } >> "$GITHUB_STEP_SUMMARY"

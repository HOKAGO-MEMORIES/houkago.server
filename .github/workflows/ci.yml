name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MYSQL_DATABASE: ci_houkago
      MYSQL_USER: ci_user
      MYSQL_PASSWORD: ci_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      HOUKAGO_RESYNC_COMMIT_HASH: ci-commit

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test Backend change classifier
        run: python3 -m unittest ops/ci/test_classify_backend_changes.py -v

      - name: Classify Backend changes
        id: classification
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLASSIFICATION_DIRECTORY: ${{ runner.temp }}/backend-change-classification
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$GITHUB_SHA"
              ;;
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              ;;
            workflow_dispatch)
              base_sha="$(git rev-parse "${GITHUB_SHA}^")"
              head_sha="$GITHUB_SHA"
              ;;
            *)
              echo "Unsupported Backend CI event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          mkdir -p "$CLASSIFICATION_DIRECTORY"
          python3 ops/ci/classify_backend_changes.py classify \
            --repository . \
            --base "$base_sha" \
            --head "$head_sha" \
            --output "$CLASSIFICATION_DIRECTORY/classification.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload Backend change classification
        uses: actions/upload-artifact@v7
        with:
          name: backend-change-classification
          path: ${{ runner.temp }}/backend-change-classification/classification.json
          if-no-files-found: error
          retention-days: 7

      - name: Summarize Backend change classification
        env:
          CLASSIFICATION: ${{ steps.classification.outputs.classification }}
          APP_CHANGED: ${{ steps.classification.outputs.app_changed }}
          OPS_CHANGED: ${{ steps.classification.outputs.ops_changed }}
          CONTROL_PLANE_CHANGED: ${{ steps.classification.outputs.control_plane_changed }}
          MIGRATION_CHANGED: ${{ steps.classification.outputs.migration_changed }}
          BASE_SHA: ${{ steps.classification.outputs.base_sha }}
          HEAD_SHA: ${{ steps.classification.outputs.head_sha }}
          UNKNOWN_PATH_COUNT: ${{ steps.classification.outputs.unknown_path_count }}
          BLOCKED_REASON: ${{ steps.classification.outputs.blocked_reason }}
        run: |
          {
            printf "## Backend change classification\n\n"
            printf -- "- Classification: \`%s\`\n" "$CLASSIFICATION"
            printf -- "- Base SHA: \`%s\`\n" "$BASE_SHA"
            printf -- "- Head SHA: \`%s\`\n" "$HEAD_SHA"
            printf -- "- Application changed: \`%s\`\n" "$APP_CHANGED"
            printf -- "- Operations changed: \`%s\`\n" "$OPS_CHANGED"
            printf -- "- Control plane changed: \`%s\`\n" "$CONTROL_PLANE_CHANGED"
            printf -- "- Migration changed: \`%s\`\n" "$MIGRATION_CHANGED"
            printf -- "- Unknown path count: \`%s\`\n" "$UNKNOWN_PATH_COUNT"
            printf -- "- Fail-closed reason: \`%s\`\n" "$BLOCKED_REASON"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build Spring Boot artifact
        run: ./gradlew bootJar --no-daemon --stacktrace

      - name: Validate production Compose
        run: |
          server_env="$RUNNER_TEMP/houkago-server.env"
          release_env="$RUNNER_TEMP/houkago-backend-release.env"
          printf '%s\n' \
            "MYSQL_DATABASE=$MYSQL_DATABASE" \
            "MYSQL_USER=$MYSQL_USER" \
            "MYSQL_PASSWORD=$MYSQL_PASSWORD" \
            "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" \
            > "$server_env"
          printf '%s\n' \
            "HOUKAGO_SERVER_IMAGE=ghcr.io/example/houkago.server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            "HOUKAGO_SERVER_REVISION=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            "HOUKAGO_SERVER_SCHEMA_COMPATIBILITY=unchanged" \
            > "$release_env"

          if env -u HOUKAGO_PUBLIC_ASSET_ORIGIN -u HOUKAGO_SERVER_IMAGE docker compose \
            --env-file "$server_env" \
            --env-file "$release_env" \
            --profile sync \
            --profile asset-sync \
            -f compose.prod.yml \
            config --quiet >/dev/null 2>&1; then
            echo "Production Compose must reject a missing public asset origin." >&2
            exit 1
          fi

          printf '%s\n' \
            "HOUKAGO_PUBLIC_ASSET_ORIGIN=https://api.example.test" \
            >> "$server_env"

          env -u HOUKAGO_SERVER_IMAGE docker compose \
            --env-file "$server_env" \
            --env-file "$release_env" \
            --profile sync \
            --profile asset-sync \
            -f compose.prod.yml \
            config --quiet
          env -u HOUKAGO_SERVER_IMAGE docker compose \
            --env-file "$server_env" \
            --env-file "$release_env" \
            --profile sync \
            --profile asset-sync \
            -f compose.prod.yml \
            config --format json | python3 -c '
          import json
          import sys

          expected = "ghcr.io/example/houkago.server@sha256:" + "a" * 64
          services = json.load(sys.stdin)["services"]
          if any(services[name]["image"] != expected for name in ("app", "sync", "asset-sync")):
              raise SystemExit("app, sync, and asset-sync must resolve to the same immutable image")

          sync = services["sync"]
          asset_sync = services["asset-sync"]
          if "mysql" not in sync.get("depends_on", {}):
              raise SystemExit("sync must retain its MySQL dependency")
          required_db_env = {"HOUKAGO_DB_URL", "HOUKAGO_DB_USERNAME", "HOUKAGO_DB_PASSWORD"}
          if not required_db_env.issubset(sync.get("environment", {})):
              raise SystemExit("sync must retain its DB environment contract")
          if asset_sync.get("depends_on"):
              raise SystemExit("asset-sync must not declare service dependencies")
          forbidden_asset_env = required_db_env | {"MYSQL_DATABASE", "MYSQL_USER", "MYSQL_PASSWORD", "MYSQL_ROOT_PASSWORD", "HOUKAGO_PUBLIC_ASSET_ORIGIN"}
          leaked_asset_env = forbidden_asset_env.intersection(asset_sync.get("environment", {}))
          if leaked_asset_env:
              raise SystemExit(f"asset-sync contains forbidden environment: {sorted(leaked_asset_env)}")
          if asset_sync.get("network_mode") != "none":
              raise SystemExit("asset-sync must run without a container network")

          asset_target = "/workspace/public-assets"
          app_targets = {volume["target"] for volume in services["app"].get("volumes", [])}
          sync_volumes = services["sync"].get("volumes", [])
          asset_sync_volumes = asset_sync.get("volumes", [])
          asset_mounts = [volume for volume in asset_sync_volumes if volume["target"] == asset_target]
          if asset_target in app_targets:
              raise SystemExit("app must not mount the public asset root")
          if asset_target in {volume["target"] for volume in sync_volumes}:
              raise SystemExit("sync must not mount the public asset root")
          if len(asset_mounts) != 1 or asset_mounts[0].get("read_only", False):
              raise SystemExit("asset-sync must mount the public asset root read-write")
          '

      - name: Build production Docker image
        run: docker build --tag houkago-server:ci .

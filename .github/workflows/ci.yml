name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MYSQL_DATABASE: ci_houkago
      MYSQL_USER: ci_user
      MYSQL_PASSWORD: ci_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      HOUKAGO_RESYNC_COMMIT_HASH: ci-commit

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build Spring Boot artifact
        run: ./gradlew bootJar --no-daemon --stacktrace

      - name: Validate production Compose
        run: |
          docker compose --profile sync -f compose.prod.yml config --quiet
          docker compose --profile sync -f compose.prod.yml config --services

      - name: Build production Docker image
        run: docker build --tag houkago-server:ci .

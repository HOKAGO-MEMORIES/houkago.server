name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MYSQL_DATABASE: ci_houkago
      MYSQL_USER: ci_user
      MYSQL_PASSWORD: ci_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      HOUKAGO_RESYNC_COMMIT_HASH: ci-commit

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build Spring Boot artifact
        run: ./gradlew bootJar --no-daemon --stacktrace

      - name: Validate production Compose
        run: |
          server_env="$RUNNER_TEMP/houkago-server.env"
          release_env="$RUNNER_TEMP/houkago-backend-release.env"
          printf '%s\n' \
            "MYSQL_DATABASE=$MYSQL_DATABASE" \
            "MYSQL_USER=$MYSQL_USER" \
            "MYSQL_PASSWORD=$MYSQL_PASSWORD" \
            "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" \
            > "$server_env"
          printf '%s\n' \
            "HOUKAGO_SERVER_IMAGE=ghcr.io/example/houkago.server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            "HOUKAGO_SERVER_REVISION=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            "HOUKAGO_SERVER_SCHEMA_COMPATIBILITY=unchanged" \
            > "$release_env"

          if env -u HOUKAGO_PUBLIC_ASSET_ORIGIN -u HOUKAGO_SERVER_IMAGE docker compose \
            --env-file "$server_env" \
            --env-file "$release_env" \
            --profile sync \
            --profile asset-sync \
            -f compose.prod.yml \
            config --quiet >/dev/null 2>&1; then
            echo "Production Compose must reject a missing public asset origin." >&2
            exit 1
          fi

          printf '%s\n' \
            "HOUKAGO_PUBLIC_ASSET_ORIGIN=https://api.example.test" \
            >> "$server_env"

          env -u HOUKAGO_SERVER_IMAGE docker compose \
            --env-file "$server_env" \
            --env-file "$release_env" \
            --profile sync \
            --profile asset-sync \
            -f compose.prod.yml \
            config --quiet
          env -u HOUKAGO_SERVER_IMAGE docker compose \
            --env-file "$server_env" \
            --env-file "$release_env" \
            --profile sync \
            --profile asset-sync \
            -f compose.prod.yml \
            config --format json | python3 -c '
          import json
          import sys

          expected = "ghcr.io/example/houkago.server@sha256:" + "a" * 64
          services = json.load(sys.stdin)["services"]
          if any(services[name]["image"] != expected for name in ("app", "sync", "asset-sync")):
              raise SystemExit("app, sync, and asset-sync must resolve to the same immutable image")

          sync = services["sync"]
          asset_sync = services["asset-sync"]
          if "mysql" not in sync.get("depends_on", {}):
              raise SystemExit("sync must retain its MySQL dependency")
          required_db_env = {"HOUKAGO_DB_URL", "HOUKAGO_DB_USERNAME", "HOUKAGO_DB_PASSWORD"}
          if not required_db_env.issubset(sync.get("environment", {})):
              raise SystemExit("sync must retain its DB environment contract")
          if asset_sync.get("depends_on"):
              raise SystemExit("asset-sync must not declare service dependencies")
          forbidden_asset_env = required_db_env | {"MYSQL_DATABASE", "MYSQL_USER", "MYSQL_PASSWORD", "MYSQL_ROOT_PASSWORD", "HOUKAGO_PUBLIC_ASSET_ORIGIN"}
          leaked_asset_env = forbidden_asset_env.intersection(asset_sync.get("environment", {}))
          if leaked_asset_env:
              raise SystemExit(f"asset-sync contains forbidden environment: {sorted(leaked_asset_env)}")
          if asset_sync.get("network_mode") != "none":
              raise SystemExit("asset-sync must run without a container network")

          asset_target = "/workspace/public-assets"
          app_targets = {volume["target"] for volume in services["app"].get("volumes", [])}
          sync_volumes = services["sync"].get("volumes", [])
          asset_sync_volumes = asset_sync.get("volumes", [])
          asset_mounts = [volume for volume in asset_sync_volumes if volume["target"] == asset_target]
          if asset_target in app_targets:
              raise SystemExit("app must not mount the public asset root")
          if asset_target in {volume["target"] for volume in sync_volumes}:
              raise SystemExit("sync must not mount the public asset root")
          if len(asset_mounts) != 1 or asset_mounts[0].get("read_only", False):
              raise SystemExit("asset-sync must mount the public asset root read-write")
          '

      - name: Build production Docker image
        run: docker build --tag houkago-server:ci .

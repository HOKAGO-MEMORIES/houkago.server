spring:
  application:
    name: houkago.server
  lifecycle:
    timeout-per-shutdown-phase: 25s
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

houkago:
  posts:
    checkout-path: ${HOUKAGO_POSTS_CHECKOUT_PATH:}
  resync:
    enabled: ${HOUKAGO_RESYNC_ENABLED:false}
    posts-root: ${HOUKAGO_RESYNC_POSTS_ROOT:}
    commit-hash: ${HOUKAGO_RESYNC_COMMIT_HASH:}
  assets:
    public-origin: ${HOUKAGO_PUBLIC_ASSET_ORIGIN:http://localhost:8080}
    publication:
      posts-root: ${HOUKAGO_ASSET_PUBLICATION_POSTS_ROOT:}
      asset-root: ${HOUKAGO_ASSET_PUBLICATION_ASSET_ROOT:}
      generation-id: ${HOUKAGO_ASSET_PUBLICATION_GENERATION_ID:}
      action: ${HOUKAGO_ASSET_PUBLICATION_ACTION:publish}
  webhook:
    github:
      posts:
        enabled: ${HOUKAGO_POSTS_WEBHOOK_ENABLED:false}
        secret: ${HOUKAGO_POSTS_WEBHOOK_SECRET:}
        repository-full-name: ${HOUKAGO_POSTS_WEBHOOK_REPOSITORY_FULL_NAME:}
        ref: ${HOUKAGO_POSTS_WEBHOOK_REF:refs/heads/main}
        spool-root: ${HOUKAGO_POSTS_WEBHOOK_SPOOL_ROOT:}
  deploy:
    webhook:
      enabled: ${HOUKAGO_DEPLOY_WEBHOOK_ENABLED:false}
      secret: ${HOUKAGO_DEPLOY_WEBHOOK_SECRET:}
      image-repository: ${HOUKAGO_DEPLOY_IMAGE_REPOSITORY:}
      spool-root: ${HOUKAGO_DEPLOY_SPOOL_ROOT:}
      worker-grace-period: ${HOUKAGO_DEPLOY_WORKER_GRACE_PERIOD:5s}
